<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Command</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Command"/>
<style>
:root {
  --bg:#F2F2F7; --card:#fff; --sep:rgba(60,60,67,.12); --label:#000;
  --sec:rgba(60,60,67,.6); --ter:rgba(60,60,67,.3); --fill:rgba(120,120,128,.2);
  --fill2:rgba(120,120,128,.12); --fill3:rgba(120,120,128,.08);
  --blue:#007AFF; --red:#FF3B30; --orange:#FF9500; --green:#34C759;
  --purple:#AF52DE; --teal:#30B0C7; --indigo:#5856D6; --pink:#FF2D55;
  --gray:#8E8E93; --r:12px;
  --safe-top:env(safe-area-inset-top,44px);
  --safe-bot:env(safe-area-inset-bottom,20px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--label);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:calc(88px + var(--safe-bot))}

/* ── HEADER ── */
.hdr{padding:calc(var(--safe-top) + 4px) 16px 0;display:flex;flex-direction:column;gap:10px}
.hdr-top{display:flex;justify-content:space-between;align-items:center}
.hdr-title{font-size:34px;font-weight:700;letter-spacing:-.5px}
.hdr-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:32px;height:32px;border-radius:50%;background:var(--fill);border:none;color:var(--blue);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}

/* search */
.search-wrap{position:relative}
.search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--ter);pointer-events:none}
.search-input{width:100%;background:var(--card);border:none;outline:none;border-radius:10px;padding:8px 10px 8px 32px;font-family:inherit;font-size:15px;color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.search-input::placeholder{color:var(--ter)}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--gray);border:none;color:#fff;border-radius:50%;width:18px;height:18px;font-size:12px;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1}

/* ── SMART GRID ── */
.grid-label{font-size:13px;font-weight:600;color:var(--ter);text-transform:uppercase;letter-spacing:.04em;padding:16px 16px 8px}
.smart-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.smart-card{background:var(--card);border-radius:var(--r);padding:13px 13px 11px;cursor:pointer;position:relative;min-height:86px;transition:opacity .12s;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.smart-card:active{opacity:.7}
.smart-card.active{outline:2.5px solid var(--c)}
.sc-icon{position:absolute;top:11px;right:11px;width:28px;height:28px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:13px}
.sc-count{font-size:32px;font-weight:700;color:var(--c);line-height:1;margin-top:18px}
.sc-label{font-size:14px;font-weight:600;margin-top:3px;color:var(--label)}

/* category cards */
.cat-card{background:var(--card);border-radius:var(--r);padding:13px 13px 11px;cursor:pointer;position:relative;min-height:86px;transition:opacity .12s;box-shadow:0 1px 3px rgba(0,0,0,.05);border-left:4px solid var(--c)}
.cat-card:active{opacity:.7}
.cat-card.active{outline:2.5px solid var(--c)}
.cc-count{font-size:32px;font-weight:700;color:var(--c);line-height:1}
.cc-label{font-size:14px;font-weight:600;margin-top:3px}

/* ── SECTION ── */
.sec-hdr{padding:20px 16px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec-title{font-size:22px;font-weight:700}
.sec-count{font-size:14px;color:var(--ter)}

/* ── TASK LIST ── */
.task-list{background:var(--card);border-radius:var(--r);margin:0 16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.task-wrap{position:relative;overflow:hidden}
.swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:20px;background:var(--red);color:#fff;font-size:14px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .1s}
.swipe-bg.left{justify-content:flex-end;background:var(--red)}
.swipe-bg.right{justify-content:flex-start;padding-left:20px;background:var(--green)}
.task-row{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border-bottom:.5px solid var(--sep);background:var(--card);position:relative;z-index:1;touch-action:pan-y;user-select:none}
.task-row:last-child{border-bottom:none}

.t-circle{width:22px;height:22px;border-radius:50%;border:2px solid var(--c);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);position:relative}
.t-circle.completing{transform:scale(1.3);background:var(--c)}
.t-circle.done{background:var(--c);border-color:var(--c)}
.t-circle.done::after,.t-circle.completing::after{content:'';width:5px;height:9px;border:1.8px solid #fff;border-top:none;border-left:none;transform:rotate(45deg) translate(0,-1px);display:block}

.t-body{flex:1;min-width:0;cursor:pointer}
.t-text{font-size:17px;line-height:1.35;transition:all .2s}
.task-row.done .t-text{color:var(--ter);text-decoration:line-through}
.t-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;align-items:center}
.t-cat-chip{font-size:11px;font-weight:600;padding:1px 7px;border-radius:20px;background:var(--chip-bg);color:var(--chip-c)}
.t-pri{font-size:12px;font-weight:500;color:var(--c)}
.t-due{font-size:12px;color:var(--ter)}
.t-due.overdue{color:var(--red);font-weight:500}
.t-due.today-due{color:var(--red);font-weight:500}
.t-recurring{font-size:11px;color:var(--ter)}
.t-sub-count{font-size:11px;color:var(--ter)}
.t-del{background:none;border:none;color:var(--fill);font-size:22px;flex-shrink:0;cursor:pointer;padding:0 2px;line-height:1;transition:color .15s;margin-top:-2px}
.t-del:active{color:var(--red)}

/* subtask expand */
.subtask-list{border-top:.5px solid var(--sep)}
.sub-row{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 46px;border-bottom:.5px solid var(--sep);background:var(--bg)}
.sub-row:last-child{border-bottom:none}
.sub-circle{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--c);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.sub-circle.done{background:var(--c)}
.sub-circle.done::after{content:'';width:4px;height:7px;border:1.5px solid #fff;border-top:none;border-left:none;transform:rotate(45deg);display:block}
.sub-text{font-size:15px;flex:1;color:var(--label)}
.sub-row.done .sub-text{color:var(--ter);text-decoration:line-through}
.sub-del{background:none;border:none;color:var(--fill);font-size:18px;cursor:pointer}

/* done section */
.done-toggle{display:flex;align-items:center;gap:6px;padding:14px 16px 6px;cursor:pointer;width:fit-content}
.done-arrow{font-size:11px;color:var(--ter);transition:transform .2s;display:inline-block}
.done-arrow.open{transform:rotate(90deg)}
.done-label{font-size:14px;font-weight:500;color:var(--ter)}

/* empty */
.empty{text-align:center;padding:36px 20px}
.empty-ico{font-size:34px;opacity:.2;margin-bottom:10px}
.empty-t{font-size:19px;font-weight:600;margin-bottom:5px}
.empty-s{font-size:15px;color:var(--ter);line-height:1.5}

/* ── ADD BAR ── */
.add-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(242,242,247,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--sep);padding:10px 14px calc(var(--safe-bot) + 10px);display:flex;gap:8px;align-items:center;z-index:100}
.add-wrap{flex:1;background:var(--card);border-radius:22px;display:flex;align-items:center;padding:8px 12px;gap:8px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.add-input{flex:1;border:none;outline:none;background:none;font-family:inherit;font-size:17px;color:var(--label);min-width:0}
.add-input::placeholder{color:var(--ter)}
.mic-btn{width:44px;height:44px;border-radius:50%;background:var(--red);border:none;color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 2px 8px rgba(255,59,48,.3);transition:all .2s}
.mic-btn.rec{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1);box-shadow:0 4px 16px rgba(255,59,48,.5)}}
.go-btn{width:44px;height:44px;border-radius:50%;background:var(--blue);border:none;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 2px 8px rgba(0,122,255,.3);transition:opacity .15s}
.go-btn:disabled{opacity:.35;box-shadow:none}

/* ── OVERLAY / SHEET ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--bg);border-radius:16px 16px 0 0;width:100%;max-width:430px;max-height:93vh;overflow-y:auto;padding-bottom:calc(var(--safe-bot) + 16px);animation:up .28s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:4px;background:rgba(60,60,67,.18);border-radius:2px;margin:8px auto 0}
.sheet-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 12px;border-bottom:.5px solid var(--sep)}
.sheet-title{font-size:17px;font-weight:600}
.sh-cancel{font-size:17px;color:var(--blue);background:none;border:none;cursor:pointer;font-family:inherit}
.sh-save{font-size:17px;font-weight:600;color:var(--blue);background:none;border:none;cursor:pointer;font-family:inherit}

/* form */
.transcript-box{margin:12px 16px 0;background:var(--fill2);border-radius:10px;padding:11px 13px}
.tl{font-size:11px;font-weight:600;color:var(--ter);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.tt{font-size:15px;color:var(--sec);font-style:italic;line-height:1.4}
.parsing-row{display:flex;align-items:center;gap:8px;padding:12px 16px;font-size:14px;color:var(--ter)}
.spin{width:16px;height:16px;border:2px solid var(--fill);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.form-sec{margin:12px 16px 0}
.form-lbl{font-size:12px;font-weight:600;color:var(--ter);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;padding-left:2px}
.form-card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.form-field{width:100%;border:none;outline:none;font-family:inherit;font-size:17px;padding:11px 14px;background:none;color:var(--label);display:block;border-bottom:.5px solid var(--sep)}
.form-field:last-child{border-bottom:none}
textarea.form-field{resize:none;min-height:50px;line-height:1.4}

/* priority buttons */
.pri-row{display:flex;padding:8px;gap:5px}
.pri-btn{flex:1;padding:7px 2px;border-radius:8px;border:1.5px solid transparent;font-size:11px;font-weight:600;cursor:pointer;text-align:center;background:var(--fill2);color:var(--gray);font-family:inherit;transition:all .15s}
.pri-btn.sel{background:var(--pb-bg);border-color:var(--pb-c);color:var(--pb-c)}

/* category select */
.cat-select-row{display:flex;flex-wrap:wrap;padding:8px;gap:6px}
.cat-sel-btn{padding:6px 12px;border-radius:20px;border:1.5px solid transparent;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;background:var(--fill2);color:var(--gray);transition:all .15s}
.cat-sel-btn.sel{background:var(--cb-bg);border-color:var(--cb-c);color:var(--cb-c)}

/* date row */
.two-col{display:grid;grid-template-columns:1fr 1fr}
.two-col .form-field{border-right:.5px solid var(--sep)}
.two-col .form-field:last-child{border-right:none}

/* recurring */
.recur-row{display:flex;flex-wrap:wrap;padding:8px;gap:5px}
.recur-btn{padding:6px 10px;border-radius:8px;border:1.5px solid transparent;font-size:12px;font-weight:500;cursor:pointer;background:var(--fill2);color:var(--gray);font-family:inherit;transition:all .15s}
.recur-btn.sel{background:#EBF3FF;border-color:var(--blue);color:var(--blue)}

/* subtask builder */
.sub-builder{padding:8px 14px}
.sub-add-row{display:flex;gap:8px;align-items:center}
.sub-add-input{flex:1;border:none;outline:none;font-family:inherit;font-size:15px;background:none;color:var(--label);padding:6px 0}
.sub-add-input::placeholder{color:var(--ter)}
.sub-add-btn{width:28px;height:28px;border-radius:50%;background:var(--blue);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sub-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:.5px solid var(--sep)}
.sub-item-text{flex:1;font-size:15px;color:var(--label)}
.sub-item-del{background:none;border:none;color:var(--ter);font-size:18px;cursor:pointer;padding:0}

/* action buttons */
.action-btns{padding:14px 16px 0;display:flex;flex-direction:column;gap:9px}
.btn-p{width:100%;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;transition:opacity .1s}
.btn-p.green{background:var(--green)}
.btn-p:active{opacity:.8}
.btn-s{width:100%;padding:14px;background:var(--fill2);color:var(--blue);border:none;border-radius:12px;font-family:inherit;font-size:17px;cursor:pointer}

/* ── SETTINGS ── */
.settings-section{margin:14px 16px 0}
.settings-label{font-size:13px;font-weight:600;color:var(--ter);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;padding-left:2px}
.settings-card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.s-row{display:flex;align-items:center;padding:13px 16px;border-bottom:.5px solid var(--sep);gap:12px}
.s-row:last-child{border-bottom:none}
.s-lbl{font-size:17px;flex:1}
.s-input{background:none;border:none;outline:none;font-family:monospace;font-size:13px;color:var(--ter);text-align:right;width:180px}
.s-note{font-size:13px;color:var(--ter);padding:6px 16px 0;line-height:1.5}
.s-note a{color:var(--blue)}
.s-danger{color:var(--red);font-size:17px;text-align:center;width:100%;padding:0}

/* category manager */
.cat-manager{padding:8px 16px}
.cat-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--sep)}
.cat-item:last-child{border-bottom:none}
.cat-color-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.cat-name-input{flex:1;border:none;outline:none;font-family:inherit;font-size:16px;background:none;color:var(--label)}
.cat-del-btn{background:none;border:none;color:var(--ter);font-size:18px;cursor:pointer}
.cat-color-picker{width:28px;height:28px;border:none;background:none;padding:0;cursor:pointer;border-radius:50%;overflow:hidden}
.cat-add-row{display:flex;align-items:center;gap:8px;padding:10px 0}
.cat-add-input{flex:1;border:none;outline:none;font-family:inherit;font-size:16px;background:none;color:var(--label)}
.cat-add-input::placeholder{color:var(--ter)}
.cat-add-btn{padding:6px 14px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}

/* search results */
.search-results{background:var(--card);border-radius:var(--r);margin:8px 16px 0;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="hdr-top">
      <span class="hdr-title">Command</span>
      <div class="hdr-actions">
        <button class="icon-btn" onclick="openSettings()" title="Settings">⚙</button>
      </div>
    </div>
    <div class="search-wrap">
      <span class="search-ico">🔍</span>
      <input class="search-input" id="searchInput" placeholder="Search tasks…" oninput="onSearch()" autocomplete="off"/>
      <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <div id="searchResultsWrap" style="display:none">
    <div class="sec-hdr"><span class="sec-title">Results</span><span class="sec-count" id="searchCount"></span></div>
    <div class="task-list" id="searchResults"></div>
  </div>

  <div id="mainContent">
    <div class="grid-label">Smart Lists</div>
    <div class="smart-grid" id="smartGrid"></div>
    <div class="grid-label" id="catGridLabel">My Lists</div>
    <div class="smart-grid" id="catGrid"></div>
    <div class="sec-hdr">
      <span class="sec-title" id="secTitle">Today</span>
      <span class="sec-count" id="secCount"></span>
    </div>
    <div class="task-list" id="taskList"></div>
    <div id="doneSection"></div>
  </div>
</div>

<!-- Add bar -->
<div class="add-bar">
  <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="Voice input">🎙</button>
  <div class="add-wrap">
    <input class="add-input" id="addInput" placeholder="Add a task or note…" autocomplete="off"/>
  </div>
  <button class="go-btn" id="goBtn" onclick="submitInput()" disabled>＋</button>
</div>

<!-- Confirm / Edit sheet -->
<div class="overlay" id="confirmOverlay" onclick="overlayTap(event,'confirmOverlay')">
  <div class="sheet" id="confirmSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-hdr">
      <button class="sh-cancel" onclick="closeOverlay('confirmOverlay')">Cancel</button>
      <span class="sheet-title" id="confirmTitle">New Task</span>
      <button class="sh-save" onclick="saveTask()">Save</button>
    </div>
    <div id="transcriptBox" class="transcript-box" style="display:none">
      <div class="tl">Heard</div>
      <div class="tt" id="transcriptText"></div>
    </div>
    <div id="parsingRow" class="parsing-row" style="display:none">
      <div class="spin"></div><span>Parsing with AI…</span>
    </div>
    <div id="formContent" style="display:none">
      <div class="form-sec">
        <div class="form-lbl">Task</div>
        <div class="form-card">
          <textarea class="form-field" id="fTask" rows="2" placeholder="What needs to be done?"></textarea>
        </div>
      </div>
      <div class="form-sec">
        <div class="form-lbl">Priority</div>
        <div class="form-card"><div class="pri-row" id="priRow"></div></div>
      </div>
      <div class="form-sec">
        <div class="form-lbl">List</div>
        <div class="form-card"><div class="cat-select-row" id="catSelectRow"></div></div>
      </div>
      <div class="form-sec">
        <div class="form-lbl">Date &amp; Time</div>
        <div class="form-card">
          <div class="two-col">
            <input class="form-field" type="date" id="fDate"/>
            <input class="form-field" type="time" id="fTime"/>
          </div>
        </div>
      </div>
      <div class="form-sec">
        <div class="form-lbl">Repeat</div>
        <div class="form-card">
          <div class="recur-row" id="recurRow"></div>
        </div>
      </div>
      <div class="form-sec">
        <div class="form-lbl">Checklist</div>
        <div class="form-card" id="subTasksCard">
          <div id="subTasksList"></div>
          <div class="sub-builder">
            <div class="sub-add-row">
              <input class="sub-add-input" id="subInput" placeholder="Add checklist item…" autocomplete="off"/>
              <button class="sub-add-btn" onclick="addSubTask()">+</button>
            </div>
          </div>
        </div>
      </div>
      <div class="form-sec">
        <div class="form-lbl">Notes</div>
        <div class="form-card">
          <textarea class="form-field" id="fNotes" rows="2" placeholder="Additional context…"></textarea>
        </div>
      </div>
      <div class="action-btns">
        <button class="btn-p green" onclick="saveAndCalendar()">📅 Save &amp; Add to Apple Calendar</button>
        <button class="btn-s" onclick="saveTask()">Save to List Only</button>
      </div>
    </div>
  </div>
</div>

<!-- Settings sheet -->
<div class="overlay" id="settingsOverlay" onclick="overlayTap(event,'settingsOverlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-hdr">
      <button class="sh-cancel" onclick="closeOverlay('settingsOverlay')">Done</button>
      <span class="sheet-title">Settings</span>
      <span></span>
    </div>

    <div class="settings-section">
      <div class="settings-label">AI</div>
      <div class="settings-card">
        <div class="s-row">
          <span class="s-lbl">Anthropic API Key</span>
          <input class="s-input" id="apiKeyInput" type="password" placeholder="sk-ant-…" oninput="saveApiKey()"/>
        </div>
      </div>
      <p class="s-note">Powers AI voice parsing. Get one free at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>. Stored only on this device.</p>
    </div>

    <div class="settings-section" style="margin-top:16px">
      <div class="settings-label">Smart Lists</div>
      <div class="settings-card">
        <div class="cat-manager" id="smartViewManager"></div>
      </div>
    </div>

    <div class="settings-section" style="margin-top:16px">
      <div class="settings-label">My Lists</div>
      <div class="settings-card">
        <div class="cat-manager" id="catManager"></div>
      </div>
    </div>

    <div class="settings-section" style="margin-top:16px">
      <div class="settings-label">Data</div>
      <div class="settings-card">
        <div class="s-row" onclick="clearCompleted()" style="cursor:pointer">
          <button class="s-danger" style="background:none;border:none;cursor:pointer;font-family:inherit">Clear Completed Tasks</button>
        </div>
        <div class="s-row" onclick="clearAll()" style="cursor:pointer">
          <button class="s-danger" style="background:none;border:none;cursor:pointer;font-family:inherit">Clear All Data</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ─── CONSTANTS ──────────────────────────────────────────────────────────────
const PRIS = {
  urgent:{label:'Urgent',c:'#FF3B30',bg:'#FFEBE9'},
  high:  {label:'High',  c:'#FF9500',bg:'#FFF3E6'},
  medium:{label:'Medium',c:'#007AFF',bg:'#E8F1FF'},
  low:   {label:'Low',   c:'#8E8E93',bg:'#F2F2F7'},
  note:  {label:'Note',  c:'#AF52DE',bg:'#F5EDFF'},
};
const PRI_ORDER = ['urgent','high','medium','low','note'];
const RECUR_OPTIONS = [
  {id:'none',label:'None'},
  {id:'daily',label:'Daily'},
  {id:'weekdays',label:'Weekdays'},
  {id:'weekly',label:'Weekly'},
  {id:'monthly',label:'Monthly'},
];
const DEFAULT_CATS = [
  {id:'villa60', name:'Villa 60',   color:'#30B0C7'},
  {id:'advisory',name:'Advisory',  color:'#5856D6'},
  {id:'personal',name:'Personal',  color:'#FF2D55'},
];
const DEFAULT_SMART_VIEWS = [
  {id:'today', label:'Today', icon:'☀️', c:'#FF3B30'},
  {id:'urgent',label:'Urgent',icon:'🔴', c:'#FF9500'},
  {id:'all',   label:'All',   icon:'📋', c:'#007AFF'},
  {id:'notes', label:'Notes', icon:'💜', c:'#AF52DE'},
];
let smartViews = JSON.parse(JSON.stringify(DEFAULT_SMART_VIEWS));

// ─── STATE ───────────────────────────────────────────────────────────────────
let tasks = [], cats = [], view = 'today', apiKey = '';
let currentDraft = null, draftSubTasks = [];
let recognition = null, isRecording = false;
let showDone = false;
let swipeState = null;

// ─── PERSIST ─────────────────────────────────────────────────────────────────
function load() {
  try {
    const s = JSON.parse(localStorage.getItem('cmd_v3')||'{}');
    tasks  = s.tasks  || [];
    cats   = s.cats   || JSON.parse(JSON.stringify(DEFAULT_CATS));
    view   = s.view   || 'today';
    apiKey = s.apiKey || '';
    if (s.smartViews) {
      smartViews = DEFAULT_SMART_VIEWS.map(def => {
        const saved = s.smartViews.find(sv=>sv.id===def.id);
        return saved ? {...def, c:saved.c} : def;
      });
    }
    document.getElementById('apiKeyInput').value = apiKey;
  } catch(e) { cats = JSON.parse(JSON.stringify(DEFAULT_CATS)); }
}
function save() {
  localStorage.setItem('cmd_v3', JSON.stringify({tasks,cats,view,apiKey,smartViews}));
}
function saveApiKey() { apiKey = document.getElementById('apiKeyInput').value.trim(); save(); }

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function todayStr() { return new Date().toISOString().split('T')[0]; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(ds) {
  if (!ds) return '';
  const td = todayStr();
  const tom = new Date(); tom.setDate(tom.getDate()+1);
  const tomS = tom.toISOString().split('T')[0];
  if (ds===td) return 'Today';
  if (ds===tomS) return 'Tomorrow';
  const d = new Date(ds+'T12:00:00');
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
}
function getCat(id) { return cats.find(c=>c.id===id); }

// ─── COUNTS ──────────────────────────────────────────────────────────────────
function countView(v) {
  const a = tasks.filter(t=>!t.done);
  if (v==='today')  return a.filter(t=>t.due===todayStr()||t.priority==='urgent').length;
  if (v==='urgent') return a.filter(t=>t.priority==='urgent').length;
  if (v==='all')    return a.length;
  if (v==='notes')  return a.filter(t=>t.priority==='note').length;
  return a.filter(t=>t.cat===v).length;
}

// ─── FILTER ──────────────────────────────────────────────────────────────────
function getActive() {
  let items = tasks.filter(t=>!t.done);
  if (view==='today')  items = items.filter(t=>t.due===todayStr()||t.priority==='urgent');
  else if (view==='urgent') items = items.filter(t=>t.priority==='urgent');
  else if (view==='notes')  items = items.filter(t=>t.priority==='note');
  else if (view!=='all') items = items.filter(t=>t.cat===view);
  return items.sort((a,b)=>PRI_ORDER.indexOf(a.priority)-PRI_ORDER.indexOf(b.priority));
}
function getDone() {
  return tasks.filter(t=>t.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,30);
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() { renderSmartGrid(); renderCatGrid(); renderList(); renderCatManager(); if(document.getElementById('smartViewManager')&&document.getElementById('settingsOverlay').classList.contains('show')) renderSmartViewManager(); }

function renderSmartGrid() {
  document.getElementById('smartGrid').innerHTML = smartViews.map(v=>`
    <div class="smart-card${view===v.id?' active':''}" style="--c:${v.c}" onclick="setView('${v.id}')">
      <div class="sc-icon">${v.icon}</div>
      <div class="sc-count">${countView(v.id)}</div>
      <div class="sc-label">${v.label}</div>
    </div>`).join('');
}

function renderCatGrid() {
  const g = document.getElementById('catGrid');
  const lbl = document.getElementById('catGridLabel');
  if (!cats.length) { g.innerHTML=''; lbl.style.display='none'; return; }
  lbl.style.display='';
  g.innerHTML = cats.map(cat=>`
    <div class="cat-card${view===cat.id?' active':''}" style="--c:${cat.color}" onclick="setView('${cat.id}')">
      <div class="cc-count">${countView(cat.id)}</div>
      <div class="cc-label">${esc(cat.name)}</div>
    </div>`).join('');
}

function renderList() {
  const items = getActive();
  const done  = getDone();
  const card  = smartViews.find(v=>v.id===view) || getCat(view) || {label:'All'};

  document.getElementById('secTitle').textContent = (card.label||card.name||'Tasks');
  document.getElementById('secCount').textContent = items.length ? `${items.length} item${items.length!==1?'s':''}` : '';

  const tl = document.getElementById('taskList');
  if (!items.length) {
    tl.innerHTML = `<div class="empty"><div class="empty-ico">✓</div><div class="empty-t">All clear</div><div class="empty-s">Tap the mic or type below<br/>to capture a task.</div></div>`;
  } else {
    tl.innerHTML = items.map(t=>taskRowHTML(t)).join('');
    attachSwipe();
  }

  // Done section
  const ds = document.getElementById('doneSection');
  if (!done.length) { ds.innerHTML=''; return; }
  const doneItems = showDone ? done.map(t=>taskRowHTML(t,true)).join('') : '';
  ds.innerHTML = `<div class="done-toggle" onclick="toggleDone()">
    <span class="done-arrow${showDone?' open':''}">▶</span>
    <span class="done-label">Completed (${done.length})</span>
  </div>
  ${showDone?`<div class="task-list" style="margin-top:0">${doneItems}</div>`:''}`;
  if (showDone) attachSwipe();
}

function taskRowHTML(t, isDoneSection=false) {
  const p = PRIS[t.priority]||PRIS.medium;
  const cat = getCat(t.cat);
  const td = todayStr();
  const dueLabel = t.due ? fmtDate(t.due)+(t.time?' · '+t.time:'') : '';
  const dueClass = t.due&&t.due<td?'overdue':t.due===td?'today-due':'';
  const recurLabel = t.recur&&t.recur!=='none'?'↻ '+RECUR_OPTIONS.find(r=>r.id===t.recur)?.label:'';
  const subCount = (t.subtasks||[]).length;
  const subDone  = (t.subtasks||[]).filter(s=>s.done).length;

  return `<div class="task-wrap" data-id="${t.id}">
    <div class="swipe-bg left">Delete</div>
    <div class="swipe-bg right">Done ✓</div>
    <div class="task-row${t.done?' done':''}" style="--c:${p.c}" data-id="${t.id}">
      <div class="t-circle${t.done?' done':''}" onclick="toggleTask('${t.id}',event)" style="--c:${p.c}"></div>
      <div class="t-body" onclick="openEdit('${t.id}')">
        <div class="t-text">${esc(t.text)}</div>
        <div class="t-meta">
          ${cat?`<span class="t-cat-chip" style="--chip-c:${cat.color};--chip-bg:${cat.color}22">${esc(cat.name)}</span>`:''}
          <span class="t-pri" style="color:${p.c}">${p.label}</span>
          ${dueLabel?`<span class="t-due ${dueClass}">· ${dueLabel}</span>`:''}
          ${recurLabel?`<span class="t-recurring">· ${recurLabel}</span>`:''}
          ${subCount?`<span class="t-sub-count">· ${subDone}/${subCount} ✓</span>`:''}
        </div>
      </div>
      <button class="t-del" onclick="deleteTask('${t.id}',event)">×</button>
    </div>
    ${subCount&&!t.done?`<div class="subtask-list">${(t.subtasks||[]).map(s=>`
      <div class="sub-row${s.done?' done':''}" style="--c:${p.c}">
        <div class="sub-circle${s.done?' done':''}" onclick="toggleSub('${t.id}','${s.id}',event)"></div>
        <span class="sub-text">${esc(s.text)}</span>
      </div>`).join('')}</div>`:''}
  </div>`;
}

// ─── SWIPE TO DELETE / COMPLETE ───────────────────────────────────────────────
function attachSwipe() {
  document.querySelectorAll('.task-row').forEach(row => {
    let startX=0, startY=0, dx=0, moved=false;
    row.addEventListener('touchstart', e=>{
      startX=e.touches[0].clientX; startY=e.touches[0].clientY; dx=0; moved=false;
    },{passive:true});
    row.addEventListener('touchmove', e=>{
      dx=e.touches[0].clientX-startX;
      const dy=Math.abs(e.touches[0].clientY-startY);
      if (Math.abs(dx)<8&&!moved) return;
      if (dy>Math.abs(dx)&&!moved) return;
      moved=true;
      const wrap=row.closest('.task-wrap');
      if (!wrap) return;
      const clamp = Math.max(-120,Math.min(80,dx));
      row.style.transform=`translateX(${clamp}px)`;
      const leftBg = wrap.querySelector('.swipe-bg.left');
      const rightBg = wrap.querySelector('.swipe-bg.right');
      if (leftBg) leftBg.style.opacity = dx<-20?Math.min(1,(Math.abs(dx)-20)/60):'0';
      if (rightBg) rightBg.style.opacity = dx>20?Math.min(1,(dx-20)/60):'0';
    },{passive:true});
    row.addEventListener('touchend', e=>{
      if (!moved) return;
      const id = row.dataset.id;
      if (dx < -80) { row.style.transition='transform .2s'; row.style.transform='translateX(-110%)';
        setTimeout(()=>deleteTask(id,{stopPropagation:()=>{}}),180); }
      else if (dx > 60) { row.style.transition='transform .2s'; row.style.transform='translateX(0)';
        setTimeout(()=>toggleTask(id,{stopPropagation:()=>{}}),50); }
      else { row.style.transition='transform .2s'; row.style.transform='translateX(0)'; }
      const wrap=row.closest('.task-wrap');
      if (wrap) { wrap.querySelectorAll('.swipe-bg').forEach(b=>b.style.opacity='0'); }
      moved=false;
    });
  });
}

// ─── TASK ACTIONS ─────────────────────────────────────────────────────────────
function toggleTask(id, e) {
  if (e && e.stopPropagation) e.stopPropagation();
  const t = tasks.find(t=>t.id===id); if (!t) return;
  const circle = document.querySelector(`.task-row[data-id="${id}"] .t-circle`);
  if (circle && !t.done) {
    circle.classList.add('completing');
    if (navigator.vibrate) navigator.vibrate(10);
    setTimeout(()=>{ t.done=true; t.doneAt=Date.now();
      if (t.recur&&t.recur!=='none') spawnRecurring(t);
      save(); render(); }, 300);
  } else {
    t.done=!t.done; if (!t.done) t.doneAt=null;
    save(); render();
  }
}
function toggleSub(tid,sid,e) {
  if (e&&e.stopPropagation) e.stopPropagation();
  const t=tasks.find(t=>t.id===tid); if (!t) return;
  const s=t.subtasks&&t.subtasks.find(s=>s.id===sid); if (!s) return;
  s.done=!s.done; save(); render();
}
function deleteTask(id,e) {
  if (e&&e.stopPropagation) e.stopPropagation();
  if (navigator.vibrate) navigator.vibrate([10,30,10]);
  tasks=tasks.filter(t=>t.id!==id); save(); render();
}
function spawnRecurring(t) {
  const next = {...t, id:uid(), done:false, doneAt:null};
  if (t.due) {
    const d=new Date(t.due+'T12:00:00');
    if (t.recur==='daily')    d.setDate(d.getDate()+1);
    else if (t.recur==='weekdays') { d.setDate(d.getDate()+1); while([0,6].includes(d.getDay()))d.setDate(d.getDate()+1); }
    else if (t.recur==='weekly')   d.setDate(d.getDate()+7);
    else if (t.recur==='monthly')  d.setMonth(d.getMonth()+1);
    next.due = d.toISOString().split('T')[0];
  }
  tasks.unshift(next);
}

// ─── VIEWS ───────────────────────────────────────────────────────────────────
function setView(v) { view=v; showDone=false; save(); render(); }
function toggleDone() { showDone=!showDone; render(); }

// ─── INPUT ───────────────────────────────────────────────────────────────────
const addInput = document.getElementById('addInput');
const goBtn    = document.getElementById('goBtn');
addInput.addEventListener('input',()=>{ goBtn.disabled=!addInput.value.trim(); });
addInput.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitInput();} });
function submitInput() {
  const text=addInput.value.trim(); if (!text) return;
  addInput.value=''; goBtn.disabled=true;
  openConfirmSheet(text,'');
}

// ─── VOICE ───────────────────────────────────────────────────────────────────
function toggleMic() {
  if (!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)) {
    alert('Voice input requires Safari on iOS or Chrome on desktop.'); return;
  }
  if (isRecording){stopMic();return;}
  startMic();
}
function startMic() {
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR(); recognition.continuous=false; recognition.interimResults=true; recognition.lang='en-US';
  const btn=document.getElementById('micBtn'); btn.classList.add('rec'); btn.textContent='⏹'; isRecording=true;
  let final='';
  recognition.onresult=e=>{
    final='';
    for(let i=0;i<e.results.length;i++) if(e.results[i].isFinal) final+=e.results[i][0].transcript;
    addInput.value=final||Array.from(e.results).map(r=>r[0].transcript).join(' ');
    goBtn.disabled=!addInput.value.trim();
  };
  recognition.onend=()=>{ stopMicUI(); const t=addInput.value.trim(); if(t){addInput.value='';goBtn.disabled=true;openConfirmSheet(t,t);} };
  recognition.onerror=()=>stopMicUI();
  recognition.start();
}
function stopMic(){if(recognition)recognition.stop();stopMicUI();}
function stopMicUI(){isRecording=false;const b=document.getElementById('micBtn');b.classList.remove('rec');b.textContent='🎙';}

// ─── CONFIRM SHEET ────────────────────────────────────────────────────────────
function openConfirmSheet(text, transcript) {
  currentDraft={id:uid(),text:'',priority:'high',cat:'',due:'',time:'',recur:'none',subtasks:[],notes:'',done:false};
  draftSubTasks=[];
  // pre-fill category from current view if it's a cat
  if (cats.find(c=>c.id===view)) currentDraft.cat=view;
  document.getElementById('confirmTitle').textContent='New Task';
  if (transcript) { document.getElementById('transcriptBox').style.display=''; document.getElementById('transcriptText').textContent=transcript; }
  else document.getElementById('transcriptBox').style.display='none';
  document.getElementById('parsingRow').style.display='';
  document.getElementById('formContent').style.display='none';
  openOverlay('confirmOverlay');
  parseWithAI(text).then(p=>{
    currentDraft.text=p.task||text; currentDraft.priority=p.priority||'high';
    currentDraft.due=p.dueDate||''; currentDraft.time=p.dueTime||''; currentDraft.notes=p.notes||'';
    if (p.category) { const m=cats.find(c=>c.name.toLowerCase()===p.category.toLowerCase()||c.id===p.category); if(m) currentDraft.cat=m.id; }
    document.getElementById('parsingRow').style.display='none';
    showForm();
  });
}
function openEdit(id) {
  const t=tasks.find(t=>t.id===id); if(!t) return;
  currentDraft={...t,subtasks:[...(t.subtasks||[]).map(s=>({...s}))]};
  draftSubTasks=[...currentDraft.subtasks];
  document.getElementById('confirmTitle').textContent='Edit Task';
  document.getElementById('transcriptBox').style.display='none';
  document.getElementById('parsingRow').style.display='none';
  showForm();
  openOverlay('confirmOverlay');
}
function showForm() {
  document.getElementById('formContent').style.display='';
  document.getElementById('fTask').value=currentDraft.text;
  document.getElementById('fDate').value=currentDraft.due;
  document.getElementById('fTime').value=currentDraft.time;
  document.getElementById('fNotes').value=currentDraft.notes||'';
  renderPriRow(currentDraft.priority);
  renderCatSelectRow(currentDraft.cat);
  renderRecurRow(currentDraft.recur||'none');
  renderSubTasksList();
}
function renderPriRow(sel) {
  document.getElementById('priRow').innerHTML=PRI_ORDER.map(p=>{
    const pr=PRIS[p];
    return `<button class="pri-btn${sel===p?' sel':''}" style="--pb-c:${pr.c};--pb-bg:${pr.bg}" onclick="setPri('${p}')">${pr.label}</button>`;
  }).join('');
}
function setPri(p){currentDraft.priority=p;renderPriRow(p);}
function renderCatSelectRow(sel) {
  document.getElementById('catSelectRow').innerHTML=
    `<button class="cat-sel-btn${!sel?' sel':''}" style="--cb-c:var(--gray);--cb-bg:var(--fill2)" onclick="setCat('')">None</button>`+
    cats.map(c=>`<button class="cat-sel-btn${sel===c.id?' sel':''}" style="--cb-c:${c.color};--cb-bg:${c.color}22" onclick="setCat('${c.id}')">${esc(c.name)}</button>`).join('');
}
function setCat(id){currentDraft.cat=id;renderCatSelectRow(id);}
function renderRecurRow(sel) {
  document.getElementById('recurRow').innerHTML=RECUR_OPTIONS.map(r=>`
    <button class="recur-btn${sel===r.id?' sel':''}" onclick="setRecur('${r.id}')">${r.label}</button>`).join('');
}
function setRecur(id){currentDraft.recur=id;renderRecurRow(id);}
function renderSubTasksList() {
  document.getElementById('subTasksList').innerHTML=draftSubTasks.map(s=>`
    <div class="sub-item">
      <span class="sub-item-text">${esc(s.text)}</span>
      <button class="sub-item-del" onclick="removeSub('${s.id}')">×</button>
    </div>`).join('');
}
function addSubTask() {
  const inp=document.getElementById('subInput'); const t=inp.value.trim(); if(!t) return;
  draftSubTasks.push({id:uid(),text:t,done:false}); inp.value=''; renderSubTasksList();
}
function removeSub(id){draftSubTasks=draftSubTasks.filter(s=>s.id!==id);renderSubTasksList();}
document.getElementById('subInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addSubTask();}});

// ─── AI PARSING ───────────────────────────────────────────────────────────────
async function parseWithAI(text) {
  const td=todayStr();
  const tom=new Date(); tom.setDate(tom.getDate()+1); const tomS=tom.toISOString().split('T')[0];
  const days=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  const today=new Date(); const dayMap={};
  for(let i=1;i<=7;i++){const d=new Date(today);d.setDate(today.getDate()+i);dayMap[days[d.getDay()]]=d.toISOString().split('T')[0];}
  const catNames=cats.map(c=>c.name).join(', ');
  if(!apiKey) return simpleParse(text,td,tomS,dayMap);
  try {
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-haiku-4-5-20251001',
        max_tokens:200,
        system:`Extract task info from natural language. Return ONLY valid JSON, no explanation.
Schema: {"task":"string","priority":"urgent|high|medium|low|note","dueDate":"YYYY-MM-DD or null","dueTime":"HH:MM or null","category":"exact list name or null","notes":"string or null"}
Priority: urgent=emergency/ASAP, high=today/important, medium=future date, low=no rush, note=FYI/remember
Available lists: ${catNames||'none'}
Today=${td}, tomorrow=${tomS}, days: ${JSON.stringify(dayMap)}
User context: Dubai-based luxury real estate operator. Villa 60=estate management tasks. Advisory=client/contractor tasks. Personal=personal life.`,
        messages:[{role:'user',content:text}]
      })
    });
    const data=await r.json();
    const raw=(data.content?.[0]?.text||'{}').trim().replace(/```json|```/g,'').trim();
    return JSON.parse(raw);
  } catch(e){ return simpleParse(text,td,tomS,dayMap); }
}
function simpleParse(text,td,tomS,dayMap) {
  const l=text.toLowerCase();
  let priority='medium';
  if(/urgent|asap|emergency|critical/.test(l)) priority='urgent';
  else if(/today|high priority|important|this morning|this afternoon/.test(l)) priority='high';
  else if(/low priority|whenever|someday|no rush/.test(l)) priority='low';
  else if(/\bnote\b|remember|fyi|don.t forget/.test(l)) priority='note';
  let dueDate=null;
  if(/\btoday\b/.test(l)) dueDate=td;
  else if(/\btomorrow\b/.test(l)) dueDate=tomS;
  else for(const [day,date] of Object.entries(dayMap)) if(new RegExp('\\b'+day+'\\b').test(l)){dueDate=date;break;}
  let dueTime=null;
  const tm=l.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/);
  if(tm){let h=parseInt(tm[1]),m=parseInt(tm[2]||'0');if(tm[3]==='pm'&&h<12)h+=12;if(tm[3]==='am'&&h===12)h=0;dueTime=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');}
  let category=null;
  cats.forEach(c=>{if(l.includes(c.name.toLowerCase()))category=c.name;});
  return {task:text,priority,dueDate,dueTime,category,notes:null};
}

// ─── SAVE ─────────────────────────────────────────────────────────────────────
function collectDraft() {
  currentDraft.text=document.getElementById('fTask').value.trim();
  currentDraft.due=document.getElementById('fDate').value;
  currentDraft.time=document.getElementById('fTime').value;
  currentDraft.notes=document.getElementById('fNotes').value.trim();
  currentDraft.subtasks=[...draftSubTasks];
}
function saveTask() {
  collectDraft(); if(!currentDraft.text){alert('Please enter a task.');return;}
  const idx=tasks.findIndex(t=>t.id===currentDraft.id);
  if(idx>=0) tasks[idx]={...currentDraft}; else tasks.unshift({...currentDraft});
  tasks.sort((a,b)=>{if(a.done!==b.done)return a.done?1:-1;return PRI_ORDER.indexOf(a.priority)-PRI_ORDER.indexOf(b.priority);});
  save(); render(); closeOverlay('confirmOverlay');
}
function saveAndCalendar() { collectDraft(); if(!currentDraft.text){alert('Please enter a task.');return;} downloadICS(currentDraft); saveTask(); }

// ─── ICS EXPORT ───────────────────────────────────────────────────────────────
function downloadICS(t) {
  const stamp=new Date().toISOString().replace(/[-:.]/g,'').slice(0,15)+'Z';
  const pad=n=>String(n).padStart(2,'0');
  let dtS,dtE;
  if(t.due&&t.time){
    const base=t.due.replace(/-/g,'')+'T'+t.time.replace(':','')+'00';
    const ed=new Date(t.due+'T'+t.time+':00'); ed.setHours(ed.getHours()+1);
    dtS=`DTSTART:${base}`; dtE=`DTEND:${t.due.replace(/-/g,'')}T${pad(ed.getHours())}${pad(ed.getMinutes())}00`;
  } else if(t.due){
    const nd=new Date(t.due+'T12:00:00'); nd.setDate(nd.getDate()+1);
    dtS=`DTSTART;VALUE=DATE:${t.due.replace(/-/g,'')}`; dtE=`DTEND;VALUE=DATE:${nd.toISOString().split('T')[0].replace(/-/g,'')}`;
  } else {
    const nd=new Date(); nd.setDate(nd.getDate()+1);
    dtS=`DTSTART;VALUE=DATE:${todayStr().replace(/-/g,'')}`; dtE=`DTEND;VALUE=DATE:${nd.toISOString().split('T')[0].replace(/-/g,'')}`;
  }
  const desc=[t.notes,t.subtasks?.map(s=>`${s.done?'[x]':'[ ]'} ${s.text}`).join('\\n')].filter(Boolean).join('\\n\\n');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Command//EN','BEGIN:VEVENT',
    `UID:${uid()}@command`,`DTSTAMP:${stamp}`,dtS,dtE,`SUMMARY:${t.text}`,
    desc?`DESCRIPTION:${desc}`:'','END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='event.ics'; a.click(); URL.revokeObjectURL(url);
}

// ─── SEARCH ──────────────────────────────────────────────────────────────────
function onSearch() {
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  const clr=document.getElementById('searchClear');
  clr.style.display=q?'flex':'none';
  const wrap=document.getElementById('searchResultsWrap');
  const main=document.getElementById('mainContent');
  if(!q){wrap.style.display='none';main.style.display='';return;}
  main.style.display='none'; wrap.style.display='';
  const results=tasks.filter(t=>t.text.toLowerCase().includes(q)||(t.notes||'').toLowerCase().includes(q));
  document.getElementById('searchCount').textContent=`${results.length} result${results.length!==1?'s':''}`;
  const sr=document.getElementById('searchResults');
  if(!results.length){ sr.innerHTML=`<div class="empty"><div class="empty-ico">🔍</div><div class="empty-t">No results</div><div class="empty-s">Try different keywords.</div></div>`; return; }
  sr.innerHTML=results.map(t=>taskRowHTML(t)).join('');
  attachSwipe();
}
function clearSearch(){document.getElementById('searchInput').value='';onSearch();}

// ─── SETTINGS ────────────────────────────────────────────────────────────────
function renderSmartViewManager() {
  document.getElementById('smartViewManager').innerHTML =
    smartViews.map(v=>`<div class="cat-item">
      <input type="color" class="cat-color-picker" value="${v.c}" oninput="updateSmartColor('${v.id}',this.value)"/>
      <span class="cat-name-input" style="font-size:16px;color:var(--label);flex:1">${esc(v.label)}</span>
      <span style="font-size:18px">${v.icon}</span>
    </div>`).join('');
}
function updateSmartColor(id, color) {
  const sv = smartViews.find(v=>v.id===id); if (!sv) return;
  sv.c = color; save(); renderSmartGrid(); renderSmartViewManager();
}

function renderCatManager() {
  document.getElementById('catManager').innerHTML=
    cats.map(c=>`<div class="cat-item">
      <input type="color" class="cat-color-picker" value="${c.color}" oninput="updateCatColor('${c.id}',this.value)"/>
      <input class="cat-name-input" value="${esc(c.name)}" oninput="updateCatName('${c.id}',this.value)" placeholder="List name"/>
      <button class="cat-del-btn" onclick="deleteCat('${c.id}')">×</button>
    </div>`).join('')+
    `<div class="cat-add-row">
      <input class="cat-add-input" id="newCatInput" placeholder="New list name…" autocomplete="off"/>
      <button class="cat-add-btn" onclick="addCat()">Add</button>
    </div>`;
  document.getElementById('newCatInput').addEventListener('keydown',e=>{if(e.key==='Enter')addCat();});
}
function updateCatColor(id,v){const c=cats.find(c=>c.id===id);if(c){c.color=v;save();render();}}
function updateCatName(id,v){const c=cats.find(c=>c.id===id);if(c){c.name=v;save();renderCatGrid();}}
function deleteCat(id){if(!confirm('Delete this list? Tasks will keep their data.'))return;cats=cats.filter(c=>c.id!==id);save();render();}
function addCat(){
  const inp=document.getElementById('newCatInput'); const name=inp.value.trim(); if(!name) return;
  const colors=['#30B0C7','#5856D6','#FF2D55','#FF9500','#34C759','#AF52DE'];
  const color=colors[cats.length%colors.length];
  cats.push({id:uid(),name,color}); inp.value=''; save(); render();
}
function openSettings(){renderCatManager();renderSmartViewManager();openOverlay('settingsOverlay');}
function clearCompleted(){if(!confirm('Remove all completed tasks?'))return;tasks=tasks.filter(t=>!t.done);save();render();}
function clearAll(){if(!confirm('Delete ALL tasks? Cannot be undone.'))return;tasks=[];save();render();}

// ─── OVERLAYS ────────────────────────────────────────────────────────────────
function openOverlay(id){document.getElementById(id).classList.add('show');}
function closeOverlay(id){document.getElementById(id).classList.remove('show');}
function overlayTap(e,id){if(e.target.id===id)closeOverlay(id);}

// ─── INIT ─────────────────────────────────────────────────────────────────────
load(); render();
</script>
